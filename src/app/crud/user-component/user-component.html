<div class="container">

  <h2>User CRUD</h2>
  <div class="api-box">
    API Called: <b>{{ apiUrlShown }}</b>
  </div>

  <div class="form">
    <input type="text" placeholder="Name" [(ngModel)]="selecteuser.name">
    <input type="email" placeholder="Email" [(ngModel)]="selectedUser.email">

    <button (click)="saveUser()">Save</button>
  </div>

  <button (click)="loadUsers()">Load Users</button>

  <table>
    <tr>
      <th>ID</th><th>Name</th><th>Email</th><th>Actions</th>
    </tr>

    <tr *ngFor="let u of users">
      <td>{{u.id}}</td>
      <td>{{u.name}}</td>
      <td>{{u.email}}</td>
      <td>
        <button (click)="editUser(u)">Edit</button>
        <button (click)="deleteUser(u.id)">Delete</button>
      </td>
    </tr>
  </table>

</div>
